server:
  port: 8888
cors:
  origin-patterns: http://localhost:8080,http://localhost:3000
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: true
    open-in-view: false
logging:
  level:
    #root: WARN
    br.com.viniciussouza: DEBUG
spring-doc:
  paths-to-match: /api/v1/**
  swagger-ui:
    use-root-path: true